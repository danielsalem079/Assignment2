<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudy Beans Café | Contact</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header>
    <nav>
      <a href="../index.html">Cloudy Beans Café</a>
      <a href="../index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>

    <section>
      <h1>Contact Us</h1>
      <p>Use this form to book a table or ask us a question.</p>

      <img src="../images/contact-cafe.svg" alt="Illustration of a café front">
    </section>

    <section>
      <h2>Booking Form</h2>

      <form id="booking-form">
        <label for="name">Name</label>
        <input type="text" id="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="message">Message</label>
        <textarea id="message" rows="5" required></textarea>

        <button class="btn" type="submit">Send</button>
        <p id="form-message"></p>
      </form>
    </section>

    <section>
      <h2>Visit Us</h2>
      <p><strong>Address:</strong> 14 Coffee Street, London</p>
      <p><strong>Opening hours:</strong> Monday to Saturday, 8am to 5pm</p>
      <p><strong>Email:</strong> hello@cloudybeans.example</p>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Cloudy Beans Café</p>
  </footer>

  <script src="../js/script.js"></script>

</body>
</html>
